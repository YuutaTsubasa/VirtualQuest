[package]
name = "quest-wasm"
version = "0.1.0"
description = "虛擬闖天下單機版：把比賽引擎包成 WebAssembly，在瀏覽器裡跑"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quest-core = { path = "../quest-core" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
